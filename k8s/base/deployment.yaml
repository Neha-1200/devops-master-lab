apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-java-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: devops-java-lab}
  template:
    metadata:
      labels: {app: devops-java-lab}
    spec:
      containers:
        - name: app
          image: neha1200/devops-java-lab:7
          imagePullPolicy: Always
          ports: [{containerPort: 8081}]
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8081}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
