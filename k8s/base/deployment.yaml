apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-java-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: devops-java-lab}
  template:
    metadata:
      labels: {app: devops-java-lab}
    spec:
      containers:
        - name: app
          image: devops-java-lab:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: devops-java-lab
spec:
  selector: {app: devops-java-lab}
  ports: [{port: 80, targetPort: 8080}]
  type: ClusterIP
